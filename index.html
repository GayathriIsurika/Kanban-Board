<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Kanban Board</title>
</head>
<body>
    <main class="board-container">
        <h1>
            <svg class="board-logo" viewBox="0 0 48 48" aria-hidden="true">
                <rect x="5" y="6" width="11" height="36" rx="3" fill="currentColor" />
                <rect x="19" y="6" width="11" height="36" rx="3" fill="currentColor" />
                <rect x="33" y="6" width="10" height="36" rx="3" fill="currentColor" />
                <rect x="7.5" y="11" width="6" height="8" rx="1.5" fill="#f2a65a" />
                <rect x="21.5" y="11" width="6" height="12" rx="1.5" fill="#2ba6a4" />
                <rect x="35" y="11" width="6" height="8" rx="1.5" fill="#f2a65a" />
            </svg>
            <span>Kanban Board</span>
        </h1>
        <form id="taskForm">
            <input type="text" id="taskInput" placeholder="New Task" required/>
            <button type="submit">Add Task</button>
        </form>
        <div class="columns">
            <div class="column" data-status="todo">
                <h2>To Do</h2>
                <div class="task-list" id="todo"></div>
            </div>
            <div class="column" data-status="inprogress">
                <h2>In Progress</h2>
                <div class="task-list" id="inprogress"></div>
            </div>
            <div class="column" data-status="done">
                <h2>Done</h2>
                <div class="task-list" id="done"></div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
